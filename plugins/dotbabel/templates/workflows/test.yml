# Pull-request verification: quality policy and acceptance criteria.
#
# This workflow VERIFIES and never writes evidence (KD-10). CI's identity is
# not a trusted author, and a second writer would race the developer's local
# run, so `dotbabel criteria verify` is called WITHOUT `--post` here. The
# evidence comment is written by the local run; this job is the independent
# re-run that confirms it. The one job that writes is `contradiction`: on a
# failed push to the default branch it may add a label and open an issue.
# Those are alarms, never evidence the merge gate reads.
#
# SEC-7: every action is pinned to a full commit SHA, the top-level token is
# read-only, each job adds only the scopes it needs, and the trigger is
# `pull_request` — never `pull_request_target`, which would run this file's
# code against fork content with a writable token and repository secrets.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Honors a SHA-pinned local attestation from a trusted author so a maintainer
  # who verified locally is not billed for a redundant remote run. Fail closed:
  # if the API call errors, grep exits non-zero, attested=false, and the verify
  # job runs.
  #
  # LIMITATION: `author_association == "OWNER"` matches only a USER-owned
  # repository. In an organization-owned repository maintainers comment as
  # MEMBER or COLLABORATOR, so nothing ever matches, attested stays false, and
  # this optimization simply never fires — the workflow stays correct, just not
  # cheaper. Widening to OWNER/MEMBER/COLLABORATOR is a deliberate trust
  # decision, because this marker is what lets someone skip remote CI: make it
  # knowingly, not by default.
  classify:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    outputs:
      attested: ${{ steps.attest.outputs.attested }}
    steps:
      - name: Check for a local attestation
        id: attest
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The marker names THIS head SHA. A marker for any other commit must
          # not match, or an attestation of older code would wave through new
          # code pushed after it.
          MARKER="<!-- local-attest verified-sha=${HEAD_SHA} -->"
          if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
               --jq '.[] | select(.author_association == "OWNER") | .body | split("\n")[0]' \
             | grep -qFx "$MARKER"; then
            echo "Local attestation found for ${HEAD_SHA} — the verify job will skip."
            echo "attested=true" >> "$GITHUB_OUTPUT"
          else
            echo "No local attestation for ${HEAD_SHA} — the verify job will run."
            echo "attested=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: classify
    if: needs.classify.outputs.attested != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # EDIT FOR YOUR PROJECT: replace this setup step with your language's.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the pull-request quality policy
        env:
          # On a push there is no pull request: grade the pushed range instead.
          # An empty --base exits 2, which would read as a failure of main.
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npx dotbabel quality check \
            --profile pr \
            --base "$QUALITY_BASE_REF" \
            --allow-project-commands \
            --json > quality-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: quality-report-pr
          path: quality-report.json

  # Deliberately independent of `classify`: a local attestation must never skip
  # criteria verification (KD-10). This job is the second opinion, so letting
  # the local run excuse it would make the local run both assert and confirm.
  dotbabel-criteria:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR HEAD, not the default merge commit: `criteria verify` fails
          # closed unless local HEAD equals the pull request head, and a merge
          # commit never does.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # EDIT FOR YOUR PROJECT: replace this setup step with your language's.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the acceptance criteria
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx dotbabel criteria verify \
            --pr "$PR_NUMBER" \
            --json > criteria-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: criteria-report
          path: criteria-report.json

  # The contradiction alarm (docs/attestation.md, "Spot checks and the
  # contradiction alarm"). Anyone who holds the maintainer's token, an AI agent
  # included, can post the attestation comment that lets the verify job and
  # /merge-pr skip their runs. This push run on the default branch is the only
  # check off that machine. When verify fails here, this job asks whether the
  # failure contradicts a passing attestation on a pull request merged since
  # the last green run. If it does, it labels each such pull request and opens
  # one issue.
  #
  # It detects a contradiction only when this run completes, on unchanged
  # detector code, while the attestation comment exists. A [skip ci] marker in
  # the merge message or a cancelled run stops it, and `dotbabel pr-stack
  # main-status` then still shows the commit as unverified debt. A deleted
  # comment also stops it.
  #
  # The detector runs from the FIRST PARENT (github.event.before, the tip of
  # the default branch before this push), and `npx dotbabel` resolves from
  # that checkout's lockfile, so the merged pull request cannot swap the
  # detector. GitHub still reads THIS file from the pushed commit: list it in
  # `attestation.governance_files`, so that a change to it forces the explicit
  # path of /merge-pr.
  #
  # Push only: a pull_request run would hand a token that can write issues to
  # code a fork controls. It costs minutes only when the default branch is
  # already red, and a run that never started (a billing limit) never reaches
  # it. The command still classifies this run before it believes the failure,
  # which is why it reads actions and checks.
  contradiction:
    needs: verify
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The detector and its lockfile, as the default branch had them
          # before this push. Full history also brings the pushed commit and
          # the range before it, so no credentialed fetch is needed later.
          ref: ${{ github.event.before }}
          fetch-depth: 0
          persist-credentials: false
      # EDIT FOR YOUR PROJECT: dotbabel needs Node even in a non-Node project.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Raise the alarm on a contradicted attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
          TEST_RESULT: ${{ needs.verify.result }}
        run: |
          npx dotbabel pr-stack contradiction \
            --sha "$MERGE_SHA" --test-result "$TEST_RESULT" --post
