name: Language-aware quality

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the PR quality policy
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          node plugins/dotbabel/bin/dotbabel-quality.mjs check \
            --profile pr \
            --base "$QUALITY_BASE_REF" \
            --allow-project-commands \
            --json > quality-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: quality-report-pr
          path: quality-report.json

  deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the deep quality profile
        run: |
          node plugins/dotbabel/bin/dotbabel-quality.mjs check \
            --profile deep \
            --base origin/main \
            --allow-project-commands \
            --json > quality-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: quality-report-deep
          path: quality-report.json
