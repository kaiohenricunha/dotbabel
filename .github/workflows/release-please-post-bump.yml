name: release-please-post-bump

# Runs after release-please bumps package.json on a release branch.
# Regenerates the three artefacts that dogfood CI checks in --check mode:
#   1. index/artifacts.json + index/by-type.json + index/by-facet.json
#      (version field in the envelope comes from package.json)
#   2. docs/*.md  _Last updated: vX.Y.Z_ stamps
#   3. plugins/dotbabel/.claude-plugin/plugin.json (version stamped from
#      package.json by build-plugin). Missing this one turned main red on the
#      2.18.1 release: package.json said 2.18.1, the plugin manifest still
#      said 2.18.0, and both `build-plugin --check` and the plugin-manifest
#      bats gate failed. Anything that derives from the version belongs here.
#   4. examples/minimal-consumer (scaffolder output). build-plugin regenerates
#      plugins/dotbabel/templates/workflows/ai-review.yml, whose projection
#      hash changes with the version; the example keeps its own copy, so the
#      4.3.0 release head failed example-parity.bats in test and dogfood.
#
# No-loop guarantee: the post-bump commit touches only index/, docs/, the
# plugin files, and the example — never package.json — so the paths filter
# never re-fires on the commit itself.
#
# PAT required: GITHUB_TOKEN pushes suppress the pull_request (synchronize)
# event on the open release PR — without the PAT, dogfood CI never re-runs
# against the fixed commit.
#
# Tracking issue: #144

on:
  push:
    branches:
      - "release-please--**"
    paths:
      - package.json

permissions:
  contents: write
  pull-requests: read

jobs:
  post-bump:
    name: regen index + stamp docs after version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: regen index
        run: node plugins/dotbabel/bin/dotbabel-index.mjs

      - name: format regen output
        run: npx --yes prettier@3 --write index/artifacts.json index/by-type.json index/by-facet.json --ignore-unknown

      - name: stamp doc versions
        run: node scripts/stamp-doc-versions.mjs

      - name: regen plugin manifest
        run: node scripts/build-plugin.mjs

      # The recipe from examples/minimal-consumer/README.md, which is the one
      # hand-maintained file there and is kept.
      - name: regen example consumer
        run: |
          readme="$(mktemp)"
          cp examples/minimal-consumer/README.md "$readme"
          rm -rf examples/minimal-consumer
          mkdir examples/minimal-consumer
          (
            cd examples/minimal-consumer || exit 1
            git init -q
            node ../../plugins/dotbabel/bin/dotbabel-init.mjs --project-name minimal-consumer --project-type node
            rm -rf .git
          )
          cp "$readme" examples/minimal-consumer/README.md

      - name: commit if anything changed
        run: |
          paths="index/ docs/ plugins/dotbabel/ examples/minimal-consumer/"
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "Nothing changed — index, stamps, plugin files and example already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add -- $paths
          git commit -m "chore: refresh index envelope + doc stamps + plugin files + example for $(node -p "require('./package.json').version")"
          git push
