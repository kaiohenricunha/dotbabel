name: dogfood

on:
  push:
    branches: [main]
  # `edited` matters: check-spec-coverage reads PR_BODY from the event payload
  # (github.event.pull_request.body). Without it, a body-only failure — a missing
  # or malformed Spec ID — cannot be fixed by editing the body, because no new
  # event fires and a rerun replays the stale payload. The only recoveries were
  # an empty commit or close/reopen.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self:
    name: self (repo root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: node plugins/dotbabel/bin/dotbabel-validate-skills.mjs
      - run: node plugins/dotbabel/bin/dotbabel-validate-specs.mjs
      - run: node plugins/dotbabel/bin/dotbabel-check-instruction-drift.mjs
      - run: node plugins/dotbabel/bin/dotbabel-check-instructions-fresh.mjs
      - run: node plugins/dotbabel/bin/dotbabel-check-instruction-parity.mjs
      - name: check-spec-coverage (PR context)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node plugins/dotbabel/bin/dotbabel-check-spec-coverage.mjs
      - run: node plugins/dotbabel/bin/dotbabel-doctor.mjs
      - run: node plugins/dotbabel/bin/dotbabel-index.mjs --check
      - run: node scripts/build-plugin.mjs --check
      - name: docs version stamps match package.json
        run: node scripts/stamp-doc-versions.mjs --check

  instruction-freshness-simulation:
    name: instruction freshness simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - name: fresh check fails before regeneration and passes after
        run: |
          tmp="$(mktemp -d)"
          cp -R . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n<!-- CI freshness simulation -->\n' >> CLAUDE.md
          if node plugins/dotbabel/bin/dotbabel-check-instructions-fresh.mjs; then
            echo "freshness check unexpectedly passed after CLAUDE.md changed" >&2
            exit 1
          fi
          node plugins/dotbabel/bin/dotbabel-generate-instructions.mjs
          node plugins/dotbabel/bin/dotbabel-check-instructions-fresh.mjs

  example:
    name: example (examples/minimal-consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - name: validators against minimal-consumer scaffold
        env:
          DOTCLAUDE_REPO_ROOT: ${{ github.workspace }}/examples/minimal-consumer
        run: |
          node plugins/dotbabel/bin/dotbabel-validate-skills.mjs --repo-root "$DOTCLAUDE_REPO_ROOT"
          # validate-specs requires docs/specs/ — the scaffold ships an empty
          # docs/specs/ (README only), so listSpecDirs returns [] and result is ok.
          node plugins/dotbabel/bin/dotbabel-validate-specs.mjs --repo-root "$DOTCLAUDE_REPO_ROOT"
