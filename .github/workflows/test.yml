name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to verify acceptance criteria for"
        required: false
        type: string

permissions:
  contents: read

# CI on the pull request head is the merge evidence, so every push starts a
# run. A newer push to the same pull request supersedes the older run; pushes
# to main are never cancelled, so each merge keeps its own verdict.
concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Local-attest gate: a SHA-pinned PR comment from a trusted user (OWNER) lets
  # a maintainer skip the redundant remote test run after verifying locally.
  # See skills/local-attest/references/operator-guide.md. Fail-closed: if the
  # gh api call errors, grep exits non-zero -> attested=false -> tests run.
  classify:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    outputs:
      attested: ${{ steps.attest.outputs.attested }}
    steps:
      - name: Check for local attestation
        id: attest
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MARKER="<!-- local-attest verified-sha=${HEAD_SHA} -->"
          if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
               --jq '.[] | select(.author_association == "OWNER") | .body | split("\n")[0]' \
             | grep -qFx "$MARKER"; then
            echo "Local attestation found for ${HEAD_SHA} — remote test job will skip."
            echo "attested=true" >> "$GITHUB_OUTPUT"
          else
            echo "No local attestation for ${HEAD_SHA} — remote test job will run."
            echo "attested=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: classify
    if: needs.classify.outputs.attested != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - name: vitest + coverage
        run: npm test -- --coverage
      - name: validate-settings behavior suite
        run: bash plugins/dotbabel/tests/test_validate_settings.sh
      # Same wrapper the local-attest bats leg runs, so the attested command
      # and the CI command are one string rather than two that claim to match.
      # It parallelises only when GNU parallel or rush is installed and runs
      # serially otherwise, so behaviour here is unchanged unless a runner
      # gains a backend.
      - name: bats
        run: bash plugins/dotbabel/scripts/run-bats.sh

      # Parallel run on one node only. The suite must stay safe to execute
      # concurrently (CONTRIBUTING, "Development workflow"), and a serial-only
      # CI can never catch a regression of that rule — a test that mutates a
      # shared repo file passes here and fails on a maintainer's attest.
      - name: bats (parallel, concurrency contract)
        if: matrix.node == '22'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq parallel
          BATS_JOBS=4 bash plugins/dotbabel/scripts/run-bats.sh
      - name: Upload coverage
        if: matrix.node == '22'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  # P-D1 dogfood: this repository runs the criteria gate it ships to consumers.
  #
  # Deliberately independent of `classify`. That gate skips the `test` job when
  # a trusted local-attest marker matches the head SHA, but `.local-attest.config.mjs`
  # has no criteria leg — so borrowing the gate would mean the criteria are
  # never verified on any pull request that attests.
  #
  # Warning: a head commit that carries `[skip ci]` suppresses the WHOLE
  # workflow run, not one job, so this job does not fire for it. The default
  # flow no longer uses the marker; `/pr-conductor` still does on demand, and
  # `workflow_dispatch` with a `pr` input exists so a maintainer can produce a
  # real criteria verdict for such a pull request.
  dotbabel-criteria:
    if: github.event_name == 'pull_request' || inputs.pr != ''
    runs-on: ubuntu-latest
    # KD-10: verify, never post. Read-only is the invariant, not the absence of
    # a `--post` flag — no write permission means no step in this job can
    # comment, whatever it is renamed to.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR HEAD, not the default merge commit: `criteria verify` fails
          # closed unless local HEAD equals the pull request head.
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr) }}
          fetch-depth: 0
          # The job then runs Node from that same PR-authored tree, so the token
          # must not be left behind in .git/config for it to read.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The in-tree bin, not `npx dotbabel`: this repository must verify itself
      # with its own working tree rather than the last published release.
      #
      # CHECK_ON_STOP_TRUST_ALL grants project-command trust for this step only.
      # `--allow-project-commands` would do that too, but it is overloaded: the
      # same flag disables the fork-PR refusal (criteria/preconditions.mjs) and
      # the SEC-1 untrusted-argv check, which would let a fork author edit a
      # criterion's `argv` in spec.json and have it executed here. The env var
      # relaxes only trust and leaves both guards armed.
      #
      # The report is written under `.dotbabel/` because the preconditions
      # reject a worktree dirty anywhere else — a bare `> criteria-report.json`
      # creates the file before node starts and fails its own run.
      - name: Verify the acceptance criteria
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          CHECK_ON_STOP_TRUST_ALL: "1"
        run: |
          mkdir -p .dotbabel
          node plugins/dotbabel/bin/dotbabel-criteria.mjs verify \
            --pr "$PR_NUMBER" \
            --json > .dotbabel/criteria-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: criteria-report
          path: .dotbabel/criteria-report.json
          if-no-files-found: warn

  # The contradiction alarm (docs/attestation.md, "Spot checks and the
  # contradiction alarm"). An agent with the owner's token can forge the
  # attestation that lets /merge-pr skip the suite. This push run on main is
  # the only check off the agent's machine. When the test job fails here, this
  # job asks whether the failure contradicts a passing attestation on a pull
  # request merged since the last green run. If it does, it labels each such
  # pull request and opens one issue.
  #
  # It detects a contradiction only when this run completes, on unchanged
  # detector code, while the attestation comment exists. A [skip ci] marker in
  # the merge message or a cancelled run stops it, and main-status then still
  # shows the commit as unverified debt. A deleted comment also stops it.
  #
  # The detector runs from the FIRST PARENT (github.event.before, the tip of
  # main before this push), so the merged pull request cannot rewrite it.
  # GitHub still reads THIS file from the pushed commit. A repository that
  # enforces attestation lists it in attestation.governance_files, so a change
  # to it forces the explicit path. This repository does not enforce
  # attestation: CI on the pull request head is its merge evidence.
  #
  # Push only: a pull_request run would hand a token that can write issues to
  # code a fork controls. It costs minutes only when main is already red, and
  # a run that never started (a billing limit) never reaches it. The command
  # still classifies this run before it believes the failure, which is why it
  # reads actions and checks.
  contradiction:
    needs: test
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The detector code, as main had it before this push. Full history
          # also brings the pushed commit (on origin/main) and the range
          # before it, so no credentialed fetch is needed later.
          ref: ${{ github.event.before }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      # The in-tree bin of the first parent: this repository checks itself
      # with its own tree, not the last published release, and not with the
      # tree under judgment.
      - name: Raise the alarm on a contradicted attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          node plugins/dotbabel/bin/dotbabel-pr-stack.mjs contradiction \
            --sha "$MERGE_SHA" --test-result "$TEST_RESULT" --post
