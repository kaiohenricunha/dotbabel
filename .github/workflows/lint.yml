name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck (warning-severity gate)
        run: |
          shellcheck --severity=warning -x \
            bootstrap.sh \
            sync.sh \
            plugins/dotbabel/scripts/*.sh \
            plugins/dotbabel/scripts/lib/*.sh \
            plugins/dotbabel/hooks/*.sh \
            plugins/dotbabel/tests/*.sh \
            plugins/dotbabel/templates/claude/hooks/*.sh \
            plugins/dotbabel/templates/githooks/pre-commit

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules" "#.claude/worktrees"

  jsdoc-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - run: node scripts/check-jsdoc-coverage.mjs plugins/dotbabel/src

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Check only JSON/YAML/MD — the .mjs source is deliberately lightly formatted
      # (see .prettierrc.json); running on .mjs today would churn a lot.
      # Resolve prettier from the lockfile, never `npx prettier@<version>`: package.json
      # is the single source of truth and Dependabot already tracks it there. A floating
      # range reformats the rules under an untouched repo; a version literal in a `run:`
      # step is tracked by nothing and rots silently. Both reddened main on 2026-08-07.
      - run: npx prettier --check "**/*.{json,yml,yaml,md}" --ignore-path .gitignore --ignore-path .prettierignore --ignore-unknown
