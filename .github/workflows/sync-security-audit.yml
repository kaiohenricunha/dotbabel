name: sync-security-audit

# Weekly: move the pinned copy of cloudflare/security-audit-skill
# (skills/security-audit/references/upstream/) to upstream HEAD and open a PR.
# Upstream has no tags or releases, so every move is a reviewed PR — the PR's
# own test.yml / dogfood.yml runs are the gate (upstream validator suites, the
# findings-to-sarif schema contract, template and example parity).
#
# SECURITY_AUDIT_SYNC_TOKEN: fine-grained PAT, this repository only, with
# Contents and Pull requests read/write. GITHUB_TOKEN cannot be used: the repo
# does not allow Actions to create pull requests, and a GITHUB_TOKEN-authored
# PR would not trigger test.yml or dogfood.yml. The PAT is used only in the
# final step, after `npm ci --ignore-scripts`, and is never persisted in
# .git/config.
#
# Each target commit gets its own branch (bot/security-audit-upstream-<short>),
# so nothing is force-pushed; an older open sync PR is closed as superseded.

on:
  schedule:
    - cron: "23 5 * * 1" # weekly Monday 05:23 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream commit to pin (default: upstream HEAD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-security-audit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22", cache: "npm" }
      - run: npm ci --ignore-scripts

      - name: Resolve the target commit
        id: target
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          current=$(node -p 'require("./skills/security-audit/references/UPSTREAM.json").commit')
          if [ -n "$INPUT_REF" ]; then
            node scripts/sync-security-audit.mjs --update --ref "$INPUT_REF"
          else
            latest=$(node scripts/sync-security-audit.mjs --latest)
            if [ "$latest" = "$current" ]; then
              echo "Pinned commit $current is upstream HEAD. Nothing to do."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            node scripts/sync-security-audit.mjs --update --ref "$latest"
          fi
          target=$(node -p 'require("./skills/security-audit/references/UPSTREAM.json").commit')
          if [ "$target" = "$current" ]; then
            echo "Pinned commit $current is already $target. Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "changed=true"
            echo "current=$current"
            echo "target=$target"
            echo "branch=bot/security-audit-upstream-${target:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate the templates and the example consumer
        if: steps.target.outputs.changed == 'true'
        run: |
          node scripts/build-plugin.mjs
          # Recipe from examples/minimal-consumer/README.md.
          rm -rf examples/minimal-consumer
          mkdir examples/minimal-consumer
          (cd examples/minimal-consumer && git init -q && node ../../plugins/dotbabel/bin/dotbabel-init.mjs --project-name minimal-consumer --project-type node && rm -rf .git)
          git checkout HEAD -- examples/minimal-consumer/README.md
          node scripts/sync-security-audit.mjs --check
          node scripts/build-plugin.mjs --check

      - name: Commit, push, and open the PR
        if: steps.target.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECURITY_AUDIT_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ steps.target.outputs.current }}
          TARGET: ${{ steps.target.outputs.target }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret SECURITY_AUDIT_SYNC_TOKEN is not set"
            exit 1
          fi
          if gh api "repos/$REPO/branches/$BRANCH" --silent 2>/dev/null; then
            echo "Branch $BRANCH already exists. A sync PR for ${TARGET:0:7} is already open or was closed on purpose."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          title="fix(skills): sync security-audit upstream to ${TARGET:0:7}"
          compare="https://github.com/cloudflare/security-audit-skill/compare/$CURRENT...$TARGET"
          git commit -q -m "$title" -m "Upstream changes: $compare"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/$REPO.git" "HEAD:refs/heads/$BRANCH"

          body="$RUNNER_TEMP/pr-body.md"
          node -e '
            const { CURRENT, TARGET } = process.env;
            const compare = "https://github.com/cloudflare/security-audit-skill/compare/" + CURRENT + "..." + TARGET;
            const code = (text) => String.fromCharCode(96) + text + String.fromCharCode(96);
            process.stdout.write([
              "## Summary",
              "",
              "- Moves the pinned copy of cloudflare/security-audit-skill from " + code(CURRENT.slice(0, 7)) + " to " + code(TARGET.slice(0, 7)) + ". Upstream changes: " + compare,
              "- Upstream has no releases, so breaking changes arrive without a version signal. Review the upstream diff, and check that " + code("skills/security-audit/SKILL.md") + " still matches the upstream headings and paths.",
              "- Opened by " + code(".github/workflows/sync-security-audit.yml") + ".",
              "",
              "## Test plan",
              "",
              "- [x] " + code("node scripts/sync-security-audit.mjs --check") + " (sync job)",
              "- [x] " + code("node scripts/build-plugin.mjs --check") + " (sync job)",
              "- [ ] " + code("test.yml") + ": " + code("security-audit-upstream.test.mjs") + " (upstream validator suites) and " + code("findings-to-sarif.test.mjs") + " (report-schema contract)",
              "- [ ] " + code("test.yml") + ": " + code("example-parity.bats") + " and " + code("security-audit-skill.bats"),
              "- [ ] " + code("dogfood.yml"),
              "",
              "## Spec ID",
              "",
              "dotbabel-core",
              "",
            ].join("\n"));
          ' > "$body"
          pr_url=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body-file "$body")
          echo "Opened $pr_url"

          # Close older sync PRs that this one supersedes. Their branches stay.
          gh pr list --repo "$REPO" --state open --search "head:bot/security-audit-upstream-" \
            --json number,headRefName --jq ".[] | select(.headRefName != \"$BRANCH\") | .number" |
            while read -r number; do
              gh pr close "$number" --repo "$REPO" --comment "Superseded by $pr_url."
            done
